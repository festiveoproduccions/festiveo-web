backend:
  name: github
  repo: festiveoproduccions/festiveo-web
  branch: main
  base_url: https://festiveo-auth.festiveoproduccions.workers.dev
  auth_endpoint: auth
locale: es
media_folder: images
public_folder: /images
publish: true
collections:
- name: apariencia
  label: 01 · Diseño y ajustes
  files:
  - name: ajustes
    label: Logo, colores, teléfonos, redes y menú
    file: cms/settings.json
    format: json
    fields:
    - label: Logo oficial
      name: logo
      widget: image
    - label: Dorado hexadecimal (#dbb77b)
      name: gold
      widget: string
    - label: Fondo hexadecimal (#080808)
      name: background
      widget: string
    - label: Texto hexadecimal (#f5f2ed)
      name: foreground
      widget: string
    - label: Foto de portada (opcional)
      name: hero_image
      widget: image
      required: false
    - label: Teléfono y WhatsApp
      name: phone
      widget: string
    - label: Email
      name: email
      widget: string
    - label: Localización
      name: location
      widget: string
    - label: Instagram URL
      name: instagram
      widget: string
      required: false
    - label: Facebook URL
      name: facebook
      widget: string
      required: false
    - label: TikTok URL
      name: tiktok
      widget: string
      required: false
    - label: Forvenues URL https://
      name: forvenues_url
      widget: string
      required: false
    - label: Menú (conservar 6 enlaces y su orden)
      name: menu
      widget: list
      summary: '{{fields.ca}}'
      fields:
      - label: Nombre catalán
        name: ca
        widget: string
      - label: Nombre castellano
        name: es
        widget: string
      - label: Destino
        name: href
        widget: string
