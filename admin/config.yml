backend:
  name: github
  repo: festiveoproduccions/festiveo-web
  branch: main
  base_url: https://festiveo-auth.festiveoproduccions.workers.dev
  auth_endpoint: auth
locale: es
media_folder: images
public_folder: /images
publish: true
collections:
- name: apariencia
  label: 01 · Diseño y contacto
  files:
  - name: ajustes
    label: Logotipo, colores, redes, contacto y menú
    file: cms/settings.json
    format: json
    fields:
    - label: Nombre comercial
      name: brand_name
      widget: string
    - label: Logotipo
      name: logo
      widget: image
    - label: 'Dorado (código #RRGGBB)'
      name: gold
      widget: string
    - label: 'Fondo (código #RRGGBB)'
      name: background
      widget: string
    - label: 'Texto (código #RRGGBB)'
      name: foreground
      widget: string
    - label: Foto de fondo de las portadas (opcional)
      name: hero_image
      widget: image
      required: false
    - label: Teléfono y WhatsApp
      name: phone
      widget: string
    - label: Email
      name: email
      widget: string
    - label: Ubicación
      name: location
      widget: string
    - label: Instagram (URL)
      name: instagram
      widget: string
      required: false
    - label: Facebook (URL)
      name: facebook
      widget: string
      required: false
    - label: TikTok (URL)
      name: tiktok
      widget: string
      required: false
    - label: Fourvenues / entradas (URL)
      name: forvenues_url
      widget: string
      required: false
    - label: Menú de navegación (mantener las seis páginas)
      name: menu
      widget: list
      fields:
      - label: Identificador de página (no modificar)
        name: id
        widget: string
      - label: Dirección de página
        name: href
        widget: string
      - label: Texto del menú
        name: label
        widget: object
        fields:
        - label: Català
          name: ca
          widget: string
        - label: Castellano
          name: es
          widget: string
- name: inicio
  label: 02 · Inicio
  files:
  - name: pagina
    label: Portada, presentación y destacados
    file: cms/inicio.json
    format: json
    fields:
    - &id001
      label: Portada · título y presentación
      name: hero
      widget: object
      fields:
      - label: Texto pequeño sobre el título
        name: kicker
        widget: object
        fields:
        - label: Català
          name: ca
          widget: string
        - label: Castellano
          name: es
          widget: string
      - label: Título de portada (admite <em>texto dorado</em>)
        name: title
        widget: object
        fields:
        - label: Català
          name: ca
          widget: text
        - label: Castellano
          name: es
          widget: text
      - label: Texto introductorio
        name: subtitle
        widget: object
        fields:
        - label: Català
          name: ca
          widget: text
        - label: Castellano
          name: es
          widget: text
    - label: Título de presentación
      name: intro_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Texto de presentación
      name: intro_text
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Texto pequeño de servicios
      name: services_kicker
      widget: object
      fields:
      - label: Català
        name: ca
        widget: string
      - label: Castellano
        name: es
        widget: string
    - label: Título de servicios
      name: services_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Título de destacados
      name: featured_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Texto de destacados
      name: featured_text
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Título de contacto
      name: cta_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Texto de contacto
      name: cta_text
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
- name: nosaltres
  label: 03 · Quiénes somos
  files:
  - name: pagina
    label: Historia, trayectoria y responsables
    file: cms/nosaltres.json
    format: json
    fields:
    - *id001
    - label: Título de la historia
      name: story_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Texto de la historia
      name: story_text
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Título de los valores
      name: mission_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Texto de los valores
      name: mission_text
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Título de la trayectoria
      name: timeline_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Etapas de la trayectoria
      name: timeline
      widget: list
      summary: '{{fields.title.ca}}'
      fields:
      - label: Fecha / etapa
        name: year
        widget: string
      - label: Título
        name: title
        widget: object
        fields:
        - label: Català
          name: ca
          widget: string
        - label: Castellano
          name: es
          widget: string
      - label: Descripción
        name: description
        widget: object
        fields:
        - label: Català
          name: ca
          widget: text
        - label: Castellano
          name: es
          widget: text
    - label: Título del equipo responsable
      name: team_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Presentación del equipo
      name: team_intro
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Responsables y equipo
      name: team
      widget: list
      fields:
      - label: Nombre
        name: name
        widget: string
      - label: Cargo / Función
        name: role
        widget: object
        fields:
        - label: Català
          name: ca
          widget: string
        - label: Castellano
          name: es
          widget: string
      - label: Presentación
        name: bio
        widget: object
        fields:
        - label: Català
          name: ca
          widget: text
        - label: Castellano
          name: es
          widget: text
      - label: Fotografía (opcional)
        name: image
        widget: image
        required: false
- name: servicios
  label: 04 · Servicios
  files:
  - name: pagina
    label: Textos y proceso de trabajo
    file: cms/serveis.json
    format: json
    fields:
    - *id001
    - label: Título introductorio
      name: intro_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Párrafo introductorio
      name: intro_text
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Título del proceso
      name: process_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Pasos del proceso
      name: steps
      widget: list
      fields:
      - label: Número
        name: number
        widget: string
      - label: Título
        name: title
        widget: object
        fields:
        - label: Català
          name: ca
          widget: string
        - label: Castellano
          name: es
          widget: string
      - label: Descripción
        name: description
        widget: object
        fields:
        - label: Català
          name: ca
          widget: text
        - label: Castellano
          name: es
          widget: text
    - label: Título de contacto
      name: cta_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
  - name: listado
    label: Añadir / editar / eliminar servicios
    file: cms/services.json
    format: json
    fields:
    - label: Servicios
      name: items
      widget: list
      summary: '{{fields.title.ca}}'
      fields:
      - label: Número de orden
        name: number
        widget: string
      - label: Nombre del servicio
        name: title
        widget: object
        fields:
        - label: Català
          name: ca
          widget: string
        - label: Castellano
          name: es
          widget: string
      - label: Descripción del servicio
        name: description
        widget: object
        fields:
        - label: Català
          name: ca
          widget: text
        - label: Castellano
          name: es
          widget: text
      - label: Imagen (opcional)
        name: image
        widget: image
        required: false
      - label: Enlace opcional HTTPS
        name: url
        widget: string
        required: false
- name: eventos
  label: 05 · Eventos y fotografías
  files:
  - name: pagina
    label: Textos de la agenda
    file: cms/esdeveniments.json
    format: json
    fields:
    - *id001
    - label: Título de la agenda
      name: intro_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Presentación de los eventos
      name: intro_text
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Título de próximos eventos
      name: upcoming_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: string
      - label: Castellano
        name: es
        widget: string
    - label: Título de eventos anteriores
      name: archive_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: string
      - label: Castellano
        name: es
        widget: string
    - label: Título de entradas
      name: ticket_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Texto de entradas
      name: ticket_text
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
  - name: listado_eventos
    label: Eventos · Añadir y subir hasta 3 fotos
    file: events.json
    format: json
    fields:
    - label: Eventos
      name: items
      widget: list
      summary: '{{fields.title.ca}}'
      fields:
      - label: Fecha visible (por ejemplo Noviembre 2026)
        name: date
        widget: string
      - label: Fecha para ordenar (AAAA-MM o AAAA-MM-DD)
        name: sort_date
        widget: string
        required: false
        hint: No se muestra al público. Mantiene la cronología aunque cambies el orden del listado.
      - label: Mes y año traducidos (opcional)
        name: date_label
        widget: object
        required: false
        fields:
        - label: Català
          name: ca
          widget: string
        - label: Castellano
          name: es
          widget: string
      - label: Título del evento
        name: title
        widget: object
        fields:
        - label: Català
          name: ca
          widget: string
        - label: Castellano
          name: es
          widget: string
      - label: Descripción completa
        name: description
        widget: object
        fields:
        - label: Català
          name: ca
          widget: text
        - label: Castellano
          name: es
          widget: text
      - label: Lugar / Sala
        name: location
        widget: string
        required: false
      - label: Categoría
        name: category
        widget: select
        options:
        - label: VENENO
          value: veneno
        - label: DRAX
          value: drax
        - label: RAVALADA
          value: ravalada
        - label: Otro
          value: otros
      - label: Estado
        name: status
        widget: select
        options:
        - label: Evento celebrado
          value: past
        - label: Próximo evento
          value: upcoming
      - label: Fotos del evento (máximo 3)
        name: photos
        widget: list
        max: 3
        required: false
        field:
          label: Foto
          name: image
          widget: image
      - label: Enlace de entradas / Fourvenues HTTPS
        name: url
        widget: string
        required: false
      - label: Fecha verificada (uso interno)
        name: verified
        widget: boolean
        required: false
        default: true
- name: artistas
  label: 06 · Artistas y colaboradores
  files:
  - name: pagina
    label: Textos de la página de artistas
    file: cms/artistes.json
    format: json
    fields:
    - *id001
    - label: Título de artistas
      name: intro_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Texto introductorio
      name: intro_text
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Título de contacto
      name: cta_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
  - name: listado
    label: Añadir / editar artistas
    file: cms/artists.json
    format: json
    fields:
    - label: Artistas
      name: items
      widget: list
      summary: '{{fields.title.ca}}'
      fields:
      - label: Nombre artístico
        name: name
        widget: string
      - label: Biografía
        name: bio
        widget: object
        fields:
        - label: Català
          name: ca
          widget: text
        - label: Castellano
          name: es
          widget: text
      - label: Fotografía
        name: image
        widget: image
        required: false
      - label: Enlace web / redes
        name: url
        widget: string
        required: false
- name: contacto
  label: 07 · Contacto
  files:
  - name: pagina
    label: Presentación y formulario de contacto
    file: cms/contacte.json
    format: json
    fields:
    - *id001
    - label: Título de contacto
      name: intro_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Texto introductorio
      name: intro_text
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Título del formulario
      name: form_title
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
    - label: Nota del formulario
      name: form_note
      widget: object
      fields:
      - label: Català
        name: ca
        widget: text
      - label: Castellano
        name: es
        widget: text
