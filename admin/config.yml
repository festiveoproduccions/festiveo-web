backend:
  name: github
  repo: festiveoproduccions/festiveo-web
  branch: main
  base_url: https://festiveo-auth.festiveoproduccions.workers.dev
  auth_endpoint: auth
locale: es
media_folder: images
public_folder: /images
publish: true
collections:
- name: apariencia
  label: 01 · Diseño y ajustes
  files:
  - name: ajustes
    label: Apariencia, logo, contacto y menú
    file: cms/settings.json
    format: json
    fields:
    - label: Logotipo
      name: logo
      widget: image
    - label: 'Color principal (hexadecimal, ejemplo #dbb77b)'
      name: gold
      widget: string
    - label: Color de fondo (hexadecimal)
      name: background
      widget: string
    - label: Color de texto (hexadecimal)
      name: foreground
      widget: string
    - label: Imagen de fondo en la portada (opcional)
      name: hero_image
      widget: image
      required: false
    - label: Teléfono / WhatsApp
      name: phone
      widget: string
    - label: Correo
      name: email
      widget: string
    - label: Localización
      name: location
      widget: string
    - label: Instagram (URL https://)
      name: instagram
      widget: string
      required: false
    - label: Facebook (URL https://)
      name: facebook
      widget: string
      required: false
    - label: TikTok (URL https://)
      name: tiktok
      widget: string
      required: false
    - label: Forvenues / Entradas (URL https://)
      name: forvenues_url
      widget: string
      required: false
    - label: Menú de navegación (no borrar secciones ni alterar el orden)
      name: menu
      widget: list
      summary: '{{fields.ca}}'
      fields:
      - label: Nombre catalán
        name: ca
        widget: string
      - label: Nombre castellano
        name: es
        widget: string
      - label: Destino
        name: href
        widget: string
