<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FESTIVEO | Administración</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
  (function () {
    'use strict';
    var h = window.h;
    var CMS = window.CMS;
    if (!CMS || !h) return;

    var theme = {
      background: '#080808',
      foreground: '#f5f2ed',
      gold: '#dbb77b'
    };
    var textStyle = {fontFamily: 'Arial, Helvetica, sans-serif', lineHeight: 1.5};
    function rawData(props) {
      var data = props.entry && props.entry.get('data');
      return data && typeof data.toJS === 'function' ? data.toJS() : {};
    }
    function tr(obj, locale) {
      if (typeof obj === 'string') return obj;
      if (!obj || typeof obj !== 'object') return '';
      return String(obj[locale] || obj.ca || obj.es || '');
    }
    function clean(str) {return String(str || '').replace(/<[^>]*>/g, '');}
    function shell(children, customTheme) {
      var colors = customTheme || theme;
      return h('div', {style: Object.assign({}, textStyle, {
        background: colors.background,
        color: colors.foreground,
        minHeight: '100vh',
        boxSizing: 'border-box',
        padding: '22px'
      })}, children);
    }
    function masthead(colors, title) {
      return h('header', {style: {borderBottom:'1px solid '+colors.gold,paddingBottom:16, marginBottom:30,display:'flex',justifyContent:'space-between',alignItems:'center',gap:15}},
        h('strong', {style: {color: colors.gold,fontSize:23,letterSpacing:2}}, 'FESTIVEO'),
        h('span', {style:{fontSize:11,opacity:.75}},title || 'PRODUCCIONS · REUS')
      );
    }
    function sectionHeader(s) {return h('div',{style:{color:theme.gold,fontWeight:700,fontSize:10,letterSpacing:2,textTransform:'uppercase',margin:'28px 0 10px'}},s)}
    function panel(title, value) {
      return h('div', {style:{background:'#15120f',border:'1px solid #423222',padding:18,margin:'10px 0'}},
        h('div',{style:{fontSize:11,color:theme.gold,marginBottom:8}},title),
        h('div',{style:{whiteSpace:'pre-wrap',overflowWrap:'anywhere'}},value));
    }
    function pagePreview(props) {
      var d = rawData(props), texts = d.texts || {}, keys = Object.keys(texts).filter(function(key){return /^text\d+$/.test(key);}).sort(function(a,b){return Number(a.slice(4))-Number(b.slice(4))});
      var locales = ['ca','es'];
      return shell(h('div', {},
        masthead(theme, 'VISTA PREVIA DE LOS TEXTOS'),
        locales.map(function(locale) {
          return h('section', {key: locale,style:{marginBottom:32,borderBottom:'1px solid #423222',paddingBottom:18}},
            sectionHeader(locale==='ca'?'CATALÀ':'CASTELLANO'),
            h('h1',{style:{fontSize:35,lineHeight:1.08,letterSpacing:'-.04em',textTransform:'uppercase',margin:'15px 0 12px'}},clean(tr(texts.text01,locale))),
            h('p',{style:{color:'#c8c3bc',fontSize:16,marginBottom:25}},clean(tr(texts.text02,locale))),
            keys.slice(2).map(function(key){var val=clean(tr(texts[key],locale));return h('div',{key:key,style:{borderTop:'1px solid #312b24',padding:'13px 0'}},
              h('span',{style:{fontSize:10,color:theme.gold,marginRight:8}},key.toUpperCase()),
              h('span',{},val))})
          );
        })
      ));
    }
    function imageFor(props,path) {
      if (!path || typeof path !== 'string') return null;
      try {
        var asset = props.getAsset(path);
        return asset && typeof asset.toString === 'function' ? asset.toString() : String(asset || path);
      } catch (e) {return path;}
    }
    function appearancePreview(props) {
      var d=rawData(props);
      var colors={background:/^#[0-9a-f]{6}$/i.test(d.background||'')?d.background:theme.background,
        foreground:/^#[0-9a-f]{6}$/i.test(d.foreground||'')?d.foreground:theme.foreground,
        gold:/^#[0-9a-f]{6}$/i.test(d.gold||'')?d.gold:theme.gold};
      return shell(h('div',{},masthead(colors,'DISEÑO Y AJUSTES'),
        d.logo ? h('img',{src:imageFor(props,d.logo),alt:'Logotipo',style:{width:250,maxWidth:'100%',height:95,objectFit:'contain',marginBottom:15}}):null,
        h('div',{style:{fontSize:10,letterSpacing:3,color:colors.gold}},'FESTIVEO PRODUCCIONS · REUS'),
        h('h1',{style:{fontSize:38,lineHeight:1.05,margin:'25px 0'}},'FEM QUE LES IDEES ',h('span',{style:{color:colors.gold}},'COBRIN VIDA.')),
        h('p',{},'Ejemplo visual de los colores y del logotipo configurados.'),
        d.hero_image?h('img',{src:imageFor(props,d.hero_image),alt:'Imagen de portada',style:{width:'100%',maxHeight:220,objectFit:'cover',margin:'15px 0'}}):null,
        h('div',{style:{marginTop:20,borderTop:'1px solid '+colors.gold,paddingTop:18}},
          h('p',{},'Teléfono: '+(d.phone||'')),h('p',{},'Correo: '+(d.email||'')),h('p',{},'Ubicación: '+(d.location||'')))
      ),colors);
    }
    function listPreview(props) {
      var d=rawData(props), items=Array.isArray(d.items)?d.items:[];
      return shell(h('div',{},masthead(theme,'VISTA PREVIA DEL LISTADO'),
        items.length ? items.map(function(item,i){
          var photo = item.image || (Array.isArray(item.photos) && item.photos[0]);
          if (photo && typeof photo === 'object') photo=photo.image;
          return h('article',{key:i,style:{background:'#141210',border:'1px solid #3a3025',padding:18,marginBottom:15}},
            photo?h('img',{src:imageFor(props,photo),style:{width:'100%',maxHeight:240,objectFit:'cover'},alt:''}):null,
            h('div',{style:{color:theme.gold,fontSize:11,marginTop:12}},item.date||''),
            h('h2',{style:{fontSize:23,margin:'8px 0'}},clean(tr(item.title||item.name,'es'))),
            h('p',{style:{color:'#bdb6ab'}},clean(tr(item.description||item.bio,'es'))),
            item.url?h('p',{style:{color:theme.gold,fontSize:12}},'Más información: '+item.url):null
          );
        }) : h('p',{style:{color:'#bdb6ab'}},'Aún no hay elementos en este listado.')
      ));
    }
    CMS.registerPreviewTemplate('pagina', pagePreview);
    CMS.registerPreviewTemplate('ajustes', appearancePreview);
    CMS.registerPreviewTemplate('listado', listPreview);
    CMS.registerPreviewTemplate('listado_eventos', listPreview);
  }());
  </script>
</body>
</html>
