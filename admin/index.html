<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080808"><title>FESTIVEO · Administración</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
  (function(){
    'use strict';
    var CMS=window.CMS,h=window.h;
    if(!CMS||!h){console.error('Decap CMS no se ha cargado correctamente.');return;}
    var routes={apariencia:'index',inicio:'index',nosaltres:'nosaltres',servicios:'serveis',eventos:'esdeveniments',artistas:'artistes',contacto:'contacte'};
    var names={apariencia:'Diseño y contacto',inicio:'Inicio',nosaltres:'Quiénes somos',servicios:'Servicios',eventos:'Eventos y fotos',artistas:'Artistas',contacto:'Contacto'};
    var synced=new WeakMap();
    function currentScope(){var match=location.hash.match(/collections\/([^/]+)/);return match?match[1]:'inicio';}
    function entryData(props){var data=props.entry&&props.entry.get('data');return data&&data.toJS?data.toJS():{};}
    function asset(props,value){if(!value||typeof value!=='string')return value;try{var a=props.getAsset(value);return a&&a.toString?a.toString():value;}catch(e){return value;}}
    function prepare(props,kind){var data=entryData(props);
      if(kind==='ajustes'){if(data.logo)data.logo=asset(props,data.logo);if(data.hero_image)data.hero_image=asset(props,data.hero_image);}
      if(kind==='listado'||kind==='listado_eventos'){
        (data.items||[]).forEach(function(item){
          if(item.image)item.image=asset(props,item.image);
          if(Array.isArray(item.photos))item.photos=item.photos.map(function(x){return typeof x==='string'?asset(props,x):x&&x.image?{image:asset(props,x.image)}:x;});
        });
      }
      if(kind==='pagina'){
        (data.team||[]).forEach(function(item){if(item.image)item.image=asset(props,item.image)});
      }
      return data;
    }
    function send(frame){var data=synced.get(frame);if(!data||!frame.contentWindow)return;try{frame.contentWindow.postMessage({type:'festiveo:preview-draft',scope:data.scope,name:data.name,content:data.data},location.origin)}catch(e){console.warn('Vista previa:',e)}}
    window.addEventListener('message',function(e){
      if(e.origin!==location.origin||!e.data||e.data.type!=='festiveo:preview-ready')return;
      document.querySelectorAll('iframe[data-preview-frame]').forEach(function(frame){if(frame.contentWindow===e.source)send(frame)});
    });
    function render(props,kind,override){
      var scope=override||currentScope(),destination=routes[scope]||'index';
      var data=prepare(props,kind),url='/'+destination+'.html?cms-preview=1';
      return h('div',{style:{background:'#080808',color:'#f7f0e5',minHeight:690,fontFamily:'Arial,Helvetica,sans-serif'}},
        h('div',{style:{padding:'12px 15px',fontSize:11,letterSpacing:'.08em',color:'#dfbc80',borderBottom:'1px solid #59462f'}},
          'VISTA PREVIA REAL · '+(names[scope]||'FESTIVEO')+' · Desplázate dentro de la web'),
        h('iframe',{
          title:'Vista previa FESTIVEO · '+(names[scope]||'FESTIVEO'),src:url,'data-preview-frame':'1',
          style:{display:'block',width:'100%',height:'680px',border:0,background:'#080808'},
          ref:function(frame){if(!frame)return;synced.set(frame,{scope:scope,name:kind,data:data});send(frame)},
          onLoad:function(ev){var frame=ev.currentTarget;synced.set(frame,{scope:scope,name:kind,data:data});send(frame);setTimeout(function(){send(frame)},300)}
        })
      );
    }
    CMS.registerPreviewTemplate('pagina',function(props){return render(props,'pagina')});
    CMS.registerPreviewTemplate('ajustes',function(props){return render(props,'ajustes','apariencia')});
    CMS.registerPreviewTemplate('listado',function(props){return render(props,'listado')});
    CMS.registerPreviewTemplate('listado_eventos',function(props){return render(props,'listado_eventos','eventos')});
  })();
  </script>
</body>
</html>
