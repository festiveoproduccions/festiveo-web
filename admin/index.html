<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>FESTIVEO · Administración</title></head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
  (function(){
    'use strict';
    var CMS=window.CMS,h=window.h;
    if(!CMS||!h){console.error('Decap CMS no ha terminado de cargar.');return;}
    var routes={apariencia:'index.html',inicio:'index.html',nosaltres:'nosaltres.html',servicios:'serveis.html',artistas:'artistes.html',eventos:'esdeveniments.html',contacto:'contacte.html'};
    var names={apariencia:'Diseño y ajustes',inicio:'Inicio',nosaltres:'Quiénes somos',servicios:'Servicios',artistas:'Artistas',eventos:'Eventos',contacto:'Contacto'};
    var latest=new WeakMap();
    function scope(){var m=location.hash.match(/collections\/([^\/]+)/);return m?m[1]:'inicio';}
    function entryData(props){var entry=props.entry&&props.entry.get('data');return entry&&entry.toJS?entry.toJS():{};}
    function asset(props,path){if(!path)return path;try{var a=props.getAsset(path);return a&&a.toString?a.toString():path;}catch(e){return path;}}
    function normalize(props,kind){
      var data=entryData(props);
      if(kind==='ajustes'){
        if(data.logo)data.logo=asset(props,data.logo);
        if(data.hero_image)data.hero_image=asset(props,data.hero_image);
      }
      if(kind==='listado'||kind==='listado_eventos'){
        (data.items||[]).forEach(function(item){
          if(item.image)item.image=asset(props,item.image);
          if(Array.isArray(item.photos))item.photos=item.photos.map(function(ph){return typeof ph==='string'?asset(props,ph):ph&&ph.image?{image:asset(props,ph.image)}:ph;});
        });
      }
      return data;
    }
    function push(frame){
      if(!frame||!frame.contentWindow)return;
      var x=latest.get(frame);if(!x)return;
      try{frame.contentWindow.postMessage({type:'festiveo:preview-draft',scope:x.scope,name:x.name,content:x.data},location.origin);}catch(e){console.warn('No se pudo sincronizar la vista previa',e);}
    }
    // El motor real de la web recibe los borradores. No usamos otra plantilla aproximada.
    window.addEventListener('message',function(event){
      if(event.origin!==location.origin||event.data?.type!=='festiveo:preview-ready')return;
      document.querySelectorAll('iframe[data-festiveo-preview]').forEach(function(frame){if(frame.contentWindow===event.source)push(frame);});
    });
    function show(props,name,forcedScope){
      var area=forcedScope||scope(),url='/'+(routes[area]||'index.html')+'?cms-preview=1';
      var draft=normalize(props,name);
      return h('div',{style:{background:'#080808',color:'#f5f2ed',fontFamily:'Arial,sans-serif',minHeight:700}},
        h('div',{style:{background:'#17130e',borderBottom:'1px solid #dbb77b',padding:'12px 15px',fontSize:12,lineHeight:1.5}},
          'VISTA PREVIA REAL · '+(names[area]||'FESTIVEO')+' · Desplázate dentro de la página. CAT / ES funciona.'),
        h('iframe',{
          title:'Vista previa de '+(names[area]||'FESTIVEO'),src:url,'data-festiveo-preview':'1',
          style:{display:'block',width:'100%',height:'710px',minHeight:'710px',border:0,background:'#080808'},
          ref:function(frame){
            if(!frame)return;
            latest.set(frame,{scope:area,name:name,data:draft});
            // El mismo iframe se reutiliza al editar: enviar siempre la última versión.
            push(frame);
          },
          onLoad:function(event){var frame=event.currentTarget;latest.set(frame,{scope:area,name:name,data:draft});push(frame);setTimeout(function(){push(frame)},250);}
        })
      );
    }
    CMS.registerPreviewTemplate('pagina',function(props){return show(props,'pagina');});
    CMS.registerPreviewTemplate('ajustes',function(props){return show(props,'ajustes','apariencia');});
    CMS.registerPreviewTemplate('listado',function(props){return show(props,'listado');});
    CMS.registerPreviewTemplate('listado_eventos',function(props){return show(props,'listado_eventos','eventos');});
  })();
  </script>
</body></html>
